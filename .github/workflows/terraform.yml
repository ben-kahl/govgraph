name: "Terraform Infrastructure"

on:
  push:
    branches:
      - main
  # pull_request trigger removed: the OIDC role trusts only refs/heads/main
  # and environment:teardown

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform"

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Load Variables
        env:
          TFVARS_CONTENT: ${{ secrets.DEV_TFVARS }}
        run: printf '%s' "$TFVARS_CONTENT" > dev.tfvars

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      # Code style check
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: terraform plan -no-color -input=false -var-file="dev.tfvars" -out=tfplan
        continue-on-error: true

      # Posts the Plan output to PR conversation
      - name: Update Pull Request
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Test 🧪\`${{ steps.test.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # Auto-apply removed: infrastructure is torn down via terraform-destroy.yml.
      # Re-add an apply step here to bring the stack back.
